# A minimal app showing ModelWorkspace over the shared conformance fixture,
# loaded through a MemoryModelSource.
name: modelling_flutter_example
description: Minimal ModelWorkspace demo for modelling_flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  modelling:
    path: ../../../dart/modelling
  modelling_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
